name: pdf-analyzer-bot

on:
  schedule:
    # Каждые 5 минут проверяем, не прислал ли ты боту PDF.
    # Можно сделать реже (например '*/15 * * * *') ради экономии минут.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Нужно право записи, чтобы коммитить state.json обратно в репозиторий
permissions:
  contents: write

# Не запускать новый прогон, пока идёт предыдущий (избегаем гонок за state.json)
concurrency:
  group: pdf-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll and analyze
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pdf_bot.py

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add state.json
            git commit -m "update poll state [skip ci]"
            git push
          else
            echo "state.json не изменился — коммит не нужен"
          fi
