name: morning-news-digest

on:
  schedule:
    # GitHub использует время UTC. 04:00 UTC = 07:00 по Москве.
    # Поменяй цифры, если хочешь другое время. Формат cron: мин час * * *
    - cron: '0 4 * * *'
  workflow_dispatch:   # позволяет запустить вручную кнопкой в интерфейсе

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news.py
